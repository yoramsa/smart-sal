name: Sync prices

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 6 * * *'
    - cron: '0 10 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'stores | full | delta | translate | tr-export | tr-import'
        required: false
        default: 'delta'
      count:
        description: 'Produits par tr-export'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: sync-prices
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 22 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=delta" >> "$GITHUB_OUTPUT"
          fi
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-haiku-4-5
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "tr-export" ]; then
            node scripts/translations-export.mjs --count=${{ inputs.count }}
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add translations/todo.json
            git commit -m "translations: lot à traduire" || echo "rien à committer"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            exit 0
          fi
          if [ "${{ steps.mode.outputs.mode }}" = "tr-import" ]; then
            node scripts/translations-import.mjs
            exit 0
          fi
          if [ "${{ steps.mode.outputs.mode }}" = "translate" ]; then
            node scripts/translate.mjs --llm
            exit 0
          fi
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            node scripts/sync-supabase.mjs --mode=stores
          fi
          node scripts/sync-supabase.mjs --mode=${{ steps.mode.outputs.mode }}
