name: Translations

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'export | import'
        required: true
        default: 'export'
      count:
        description: 'Produits par export'
        required: false
        default: '300'

permissions:
  contents: write

concurrency:
  group: translations
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Export
        if: ${{ inputs.mode == 'export' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node scripts/translations-export.mjs --count=${{ inputs.count }}
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add translations/todo.json
          git commit -m "translations: lot à traduire" || echo "rien à committer"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
      - name: Import
        if: ${{ inputs.mode == 'import' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/translations-import.mjs
